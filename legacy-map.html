<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFS ICAO Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100vw; height: 100vh; }

        #layer-toggles {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #layer-toggles button {
            padding: 8px 14px;
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            background: #fff;
            font: 14px/1.2 system-ui, sans-serif;
            cursor: pointer;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
            text-align: left;
        }

        #layer-toggles button:hover {
            background: #f4f4f4;
        }

        #layer-toggles button.active {
            background: #2a5a9a;
            color: #fff;
            border-color: #1e4474;
        }

        .airplane-marker {
            background: transparent;
            border: none;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.65));
        }
    </style>
</head>
<body>

    <div id="layer-toggles">
        <button id="toggle-dfs" class="active" type="button" aria-pressed="true">ICAO Germany (DFS)</button>
        <button id="toggle-france" type="button" aria-pressed="false">OACI-VFR France (IGN)</button>
        <button id="toggle-austria-vfr" type="button" aria-pressed="false">VFR Online Austria (ACG)</button>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        var map = L.map('map').setView([50.0, 10.0], 6);
        var DEFAULT_ZOOM = 10;
        var youAreHereMarker = null;

        var airplaneIcon = L.divIcon({
            className: 'airplane-marker',
            html:
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="56" height="56" aria-hidden="true">' +
                '<path fill="#ff2d2d" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" ' +
                'd="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>' +
                '</svg>',
            iconSize: [56, 56],
            iconAnchor: [28, 28]
        });

        function centerMap(lat, lon, zoom) {
            map.setView([lat, lon], zoom == null ? DEFAULT_ZOOM : zoom);
            if (youAreHereMarker) {
                youAreHereMarker.setLatLng([lat, lon]);
            } else {
                youAreHereMarker = L.marker([lat, lon], {
                    icon: airplaneIcon,
                    title: 'You are here',
                    zIndexOffset: 1000
                }).addTo(map);
            }
        }

        function locateByIp() {
            return fetch('https://get.geojs.io/v1/ip/geo.json')
                .then(function (res) {
                    if (!res.ok) throw new Error('IP geo HTTP ' + res.status);
                    return res.json();
                })
                .then(function (data) {
                    var lat = parseFloat(data.latitude);
                    var lon = parseFloat(data.longitude);
                    if (Number.isNaN(lat) || Number.isNaN(lon)) {
                        throw new Error('IP geo missing coordinates');
                    }
                    centerMap(lat, lon);
                });
        }

        function locateUser() {
            if (!navigator.geolocation) {
                return locateByIp().catch(function () {});
            }

            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    centerMap(pos.coords.latitude, pos.coords.longitude);
                },
                function () {
                    locateByIp().catch(function () {});
                },
                {
                    enableHighAccuracy: false,
                    timeout: 8000,
                    maximumAge: 300000
                }
            );
        }

        locateUser();

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        var dfsLayer = L.tileLayer('https://secais.dfs.de/static-maps/icao500/tiles/{z}/{x}/{y}.png', {
            minZoom: 5,
            maxZoom: 12,
            opacity: 0.85,
            attribution: '&copy; DFS Deutsche Flugsicherung GmbH'
        }).addTo(map);

        var TransparentJpegLayer = L.TileLayer.extend({
            createTile: function (coords, done) {
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                var img = new Image();
                img.crossOrigin = 'anonymous';

                img.onload = function () {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    try {
                        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        punchChartPadding(imageData);
                        ctx.putImageData(imageData, 0, 0);
                    } catch (err) {
                        // CORS-tainted canvas: show tile as-is
                    }

                    done(null, canvas);
                };

                img.onerror = function () {
                    done(new Error('France tile failed to load'), canvas);
                };

                img.src = this.getTileUrl(coords);
                return canvas;
            }
        });

        function punchChartPadding(imageData) {
            var w = imageData.width;
            var h = imageData.height;
            var data = imageData.data;
            var visited = new Uint8Array(w * h);
            var stack = [];

            function isPadding(i) {
                var r = data[i];
                var g = data[i + 1];
                var b = data[i + 2];
                var nearWhite = r > 242 && g > 242 && b > 242;
                var nearBlack = r < 40 && g < 40 && b < 40;
                return nearWhite || nearBlack;
            }

            function tryPush(x, y) {
                if (x < 0 || y < 0 || x >= w || y >= h) return;
                var idx = y * w + x;
                if (visited[idx]) return;
                if (!isPadding(idx * 4)) return;
                visited[idx] = 1;
                stack.push(idx);
            }

            for (var x = 0; x < w; x++) {
                tryPush(x, 0);
                tryPush(x, h - 1);
            }
            for (var y = 0; y < h; y++) {
                tryPush(0, y);
                tryPush(w - 1, y);
            }

            while (stack.length) {
                var p = stack.pop();
                var px = p % w;
                var py = (p - px) / w;
                data[p * 4 + 3] = 0;
                tryPush(px + 1, py);
                tryPush(px - 1, py);
                tryPush(px, py + 1);
                tryPush(px, py - 1);
            }
        }

        var franceLayer = new TransparentJpegLayer(
            'https://data.geopf.fr/private/wmts?' +
            'SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0' +
            '&LAYER=GEOGRAPHICALGRIDSYSTEMS.MAPS.SCAN-OACI' +
            '&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM' +
            '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}' +
            '&apikey=ign_scan_ws',
            {
                minZoom: 6,
                maxZoom: 11,
                opacity: 1,
                bounds: [[41.0, -5.8], [51.5, 10.2]],
                attribution: '&copy; <a href="https://www.geoportail.gouv.fr/donnees/carte-oaci-vfr">IGN / SIA</a>'
            }
        );

        function bindToggle(buttonId, layer) {
            var button = document.getElementById(buttonId);
            button.addEventListener('click', function () {
                if (map.hasLayer(layer)) {
                    map.removeLayer(layer);
                    button.classList.remove('active');
                    button.setAttribute('aria-pressed', 'false');
                } else {
                    map.addLayer(layer);
                    button.classList.add('active');
                    button.setAttribute('aria-pressed', 'true');
                }
            });
        }

        var austriaVfrLayers = [
            'FIR', 'CTA', 'CTR', 'TMA', 'MCTR', 'MTMA', 'MATZ',
            'R', 'D', 'TRA',
            'RAS-MTA', 'RAS-GLD', 'RAS-HPG', 'RAS-PARA', 'RAS-RMZ', 'RAS-TMZ',
            'AD', 'ASA', 'FIS', 'VFR_REPP',
            'OBSTACLES_ENR', 'NATIONALPARKS', 'MODEL_AF',
            'MAX_ELEV_FIGURES', 'VOR_DME', 'NDB', 'DME'
        ].join(',');

        var austriaVfrLayer = L.tileLayer.wms('https://sdigeo-free.austrocontrol.at/geoserver/free/wms', {
            layers: austriaVfrLayers,
            format: 'image/png',
            transparent: true,
            version: '1.1.1',
            opacity: 1,
            bounds: [[46.3, 9.4], [49.1, 17.3]],
            attribution: '&copy; <a href="https://maps.austrocontrol.at/mapstore/#/viewer/121">Austro Control</a>'
        });

        bindToggle('toggle-dfs', dfsLayer);
        bindToggle('toggle-france', franceLayer);
        bindToggle('toggle-austria-vfr', austriaVfrLayer);
    </script>
</body>
</html>
